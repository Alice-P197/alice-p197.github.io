<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>计算光学资源索引 · Computational Optics Index</title>
<meta name="description" content="计算光学与深度学习资源索引：论文复现、衍射传播、相位反演、光束整形与工具集。">
<style>
:root{
  --paper:#fbfaf7;
  --ink:#12110e;
  --muted:#6c675d;
  --line:#dcd7cc;
  --accent:#24486b;
  --soft:#efece4;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Times New Roman","SimSun","Songti SC",serif;
  font-size:15.5px;
  line-height:1.65;
}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 32px}
hr{border:0;height:1px;background:var(--line)}

/* header */
.top{border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;
  height:56px;max-width:1120px;margin:0 auto;padding:0 32px}
.mark{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;gap:24px;font-size:13.5px;color:var(--muted)}
.nav a:hover{color:var(--accent)}
.nav a::after{content:"";display:block;height:1px;background:transparent}
.nav a:hover::after{background:var(--accent)}

/* masthead */
.head{padding:56px 0 34px;border-bottom:1px solid var(--line)}
.kicker{font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--muted)}
h1{font-size:clamp(30px,4vw,40px);font-weight:400;letter-spacing:.01em;
  line-height:1.3;margin:14px 0 10px}
.sub{color:var(--muted);max-width:700px;margin-top:4px}

/* section */
.sec{padding:46px 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;
  gap:20px;margin-bottom:20px}
.sec-h h2{font-size:17px;font-weight:400;letter-spacing:.06em}
.sec-h .n{font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted)}

/* site cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:960px){.cards{grid-template-columns:repeat(2,1fr)}}
.card{border:1px solid var(--line);background:#fff;padding:24px 22px 18px;
  display:flex;flex-direction:column;min-height:178px;
  transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.card:hover{transform:translateY(-2px);border-color:#b9b2a4;
  box-shadow:0 10px 24px -20px rgba(18,17,14,.55)}
.c-num{font-size:11.5px;color:var(--muted);letter-spacing:.12em}
.c-title{font-size:16px;margin:10px 0 2px;line-height:1.4}
.c-title a:hover{color:var(--accent)}
.c-en{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.c-desc{font-size:13.5px;color:var(--muted);margin-top:13px;flex:1}
.c-foot{display:flex;align-items:center;justify-content:space-between;
  margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.c-tag{font-size:11.5px;color:#4e4941;background:var(--soft);
  border:1px solid var(--line);padding:1px 8px}
.c-go{font-size:13.5px;color:var(--accent)}
.c-go:hover{text-decoration:underline}

/* repos */
.cols{columns:2;column-gap:48px}
@media(max-width:780px){.cols{columns:1}}
.grp{break-inside:avoid;margin-bottom:28px}
.grp h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-weight:400;margin-bottom:9px;
  padding-bottom:7px;border-bottom:1px solid var(--line)}
.grp ul{list-style:none}
.grp li{padding:2px 0;font-size:13.5px}
.grp li a:hover{color:var(--accent);text-decoration:underline}

footer{border-top:1px solid var(--line);padding:26px 0 40px;
  font-size:12.5px;color:var(--muted);display:flex;
  justify-content:space-between;gap:14px;flex-wrap:wrap}
footer a:hover{color:var(--accent)}

@media(max-width:680px){
  .wrap,.top-in{padding:0 20px}
  .nav{gap:14px;font-size:13px}
  .head{padding:38px 0 26px}
  .cards{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <span class="mark">Computational Optics · Index</span>
    <nav class="nav">
      <a href="#sites">站点</a>
      <a href="#repos">仓库</a>
      <a href="https://github.com/Alice-P197" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </div>
</div>

<header class="head wrap">
  <div class="kicker">Optics · Deep Learning · Reproducible Tools</div>
  <h1>计算光学资源索引</h1>
  <p class="sub">
    汇总衍射传播、相位反演、光束整形与深度学习方向的公开工具、复现记录与教学材料。
  </p>
</header>

<main>
  <section class="sec wrap" id="sites">
    <div class="sec-h">
      <h2>站点</h2>
      <span class="n">Published · GitHub Pages</span>
    </div>
    <div class="cards" id="siteCards"></div>
  </section>

  <hr>

  <section class="sec wrap" id="repos">
    <div class="sec-h">
      <h2>代码仓库</h2>
      <span class="n">public repositories · by topic</span>
    </div>
    <div class="cols" id="repoCols"></div>
  </section>
</main>

<footer class="wrap">
  <span>© 2026 · 内容遵循各仓库所附许可协议</span>
  <span>
    <a href="https://github.com/Alice-P197" target="_blank" rel="noopener">GitHub</a>
    &nbsp;·&nbsp;
    <a href="https://alice-p197.github.io/literature-archive/" target="_blank"
       rel="noopener">Literature Archive</a>
  </span>
</footer>

<script>
var SITES = [
  { no: "01", title: "文献档案馆", en: "Literature Archive",
    desc: "光学论文复现与文献索引，收录 7 篇复现记录与 7 个研究方向。",
    tag: "复现 · 索引",
    url: "https://alice-p197.github.io/literature-archive/",
    repo: "literature-archive" },
  { no: "02", title: "深度学习学习站", en: "Deep Learning Site",
    desc: "17 章深度学习教程，覆盖数学基础、网络结构、训练与工程部署。",
    tag: "教程 · 工程",
    url: "https://alice-p197.github.io/deep-learning-site/",
    repo: "deep-learning-site" },
  { no: "03", title: "创作台", en: "Black Cat Studio",
    desc: "面向技术写作的排版与内容编排工具，提供网页版与桌面端。",
    tag: "写作 · 工具",
    url: "https://alice-p197.github.io/blackcat-studio/",
    repo: "blackcat-studio" },
  { no: "04", title: "光学就业网", en: "Optics Careers",
    desc: "光学工程师岗位聚合与在招有效性校验，支持按方向与城市筛选。",
    tag: "招聘 · 聚合",
    url: "https://alice-p197.github.io/optical-engineer-jobs/",
    repo: "optical-engineer-jobs" },
  { no: "05", title: "智慧物理实验室", en: "Physics Lab",
    desc: "可交互的物理实验演示，用于教学演示与原理验证。",
    tag: "教学 · 可视化",
    url: "https://alice-p197.github.io/black-cat-physics-lab/",
    repo: "black-cat-physics-lab" },
  { no: "06", title: "DS Prime", en: "DS Prime",
    desc: "工具入口与资源分发页面。",
    tag: "应用",
    url: "https://alice-p197.github.io/ds_prime/",
    repo: "ds_prime" }
];

var GROUPS = [
  { name: "光学与计算光学", repos: [
    "collins_equation", "slm-phase-optimization", "petal-mode-laser",
    "double-phase-encoding-vortex-array", "rotational-doppler-vortex-detection",
    "fresnel-diffraction-matlab", "laser-cavity-analysis", "Triplet_FOV30",
    "doe-image-reconstruction", "waterfall-plot",
    "matlab-plot-schematics-toolkits" ] },
  { name: "站点与文档", repos: [
    "literature-archive", "deep-learning-site", "readMD" ] },
  { name: "教学与科普", repos: [
    "black-cat-physics-lab", "MATLAB_for_Physics_Education" ] },
  { name: "网页工具", repos: [
    "blackcat-studio", "optical-engineer-jobs", "ds_prime", "cat-healing",
    "luoxiaohei-desktop-pet", "gesture_interaction" ] },
  { name: "DeepSeek Harness", repos: [
    "dsh-skills", "dsh-companion-kit", "deepseek-terminal", "xunjie-software" ] },
  { name: "技能与打包", repos: [
    "web-to-android-apk-skill", "web-to-windows-desktop-skill", "img2threejs",
    "zhihu-publisher-full", "auto_sender_docs" ] },
  { name: "归档", repos: [ "xiaoheimiao-workbench", "workbench" ] }
];

function card(s) {
  return '<div class="card">' +
    '<span class="c-num">' + s.no + '</span>' +
    '<div class="c-title"><a href="' + s.url + '" target="_blank" rel="noopener"' +
    ' data-track="open_site" data-track-label="' + s.repo + '">' + s.title +
    '</a></div>' +
    '<div class="c-en">' + s.en + '</div>' +
    '<div class="c-desc">' + s.desc + '</div>' +
    '<div class="c-foot"><span class="c-tag">' + s.tag + '</span>' +
    '<a class="c-go" href="' + s.url + '" target="_blank" rel="noopener"' +
    ' aria-label="打开 ' + s.title + '">访问 →</a></div>' +
    '</div>';
}

function repoList() {
  return GROUPS.map(function (g) {
    var items = g.repos.map(function (r) {
      return '<li><a href="https://github.com/Alice-P197/' + r + '"' +
        ' target="_blank" rel="noopener">' + r + '</a></li>';
    }).join("");
    return '<div class="grp"><h3>' + g.name + ' · ' + g.repos.length +
      '</h3><ul>' + items + '</ul></div>';
  }).join("");
}

document.getElementById("siteCards").innerHTML = SITES.map(card).join("");
document.getElementById("repoCols").innerHTML = repoList();
</script>

<script src="https://alice-p197.github.io/analytics.js" defer></script>
</body>
</html>
